[package]
name = "oracle"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "oracle"
path = "src/main.rs"

[dependencies]
randomness-beacon = { path = "../programs/randomness-beacon", features = ["no-entrypoint"] }

tokio = { version = "1", features = ["full"] }
solana-client = "=1.18.26"
solana-sdk = "=1.18.26"
anchor-client = "0.30.1"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
anchor-lang = "0.30.1"
