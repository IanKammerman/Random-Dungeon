[package]
name = "oracle"
version = "0.1.0"
edition = "2021"

[lib]
name = "oracle"
path = "src/lib.rs"

[[bin]]
name = "oracle"
path = "src/main.rs"

[dependencies]
randomness-beacon = { path = "../programs/randomness-beacon", features = ["no-entrypoint"] }

tokio = { version = "1", features = ["full"] }
solana-client = "1.18"
solana-sdk = "1.18"
anchor-client = "0.30.1"
anchor-lang = "0.30.1"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
futures = "0.3"
hex = "0.4"
sha2 = "0.10"
anchor-lang = "0.30.1"
rand = "0.8"

[dev-dependencies]
solana-program-test = "1.18"
