[workspace]
resolver = "2"
members = [
    "programs/*",
    "oracle",
    "crates/vrf-core",
    "crates/vrf-circuit",
    "crates/setup",
    "crates/prover",
    "crates/verifier-client",
    "crates/solana-program",
]
exclude = [
    "crates/solana-local-validator-test",
]

[profile.release]
overflow-checks = true

[workspace.dependencies]
anyhow = "1"
ark-bn254 = "0.5"
ark-crypto-primitives = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
ark-groth16 = "0.5"
ark-r1cs-std = "0.5"
ark-relations = "0.5"
proc-macro2 = "=1.0.94"
ark-serialize = "0.5"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"